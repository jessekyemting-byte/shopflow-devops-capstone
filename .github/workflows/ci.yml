name: ShopFlow CI Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    name: Run Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r application/backend/requirements.txt

      - name: Execute Pytest
        env:
          PYTHONPATH: application/backend
        run: |
          pytest application/backend/tests/

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: application/backend
          file: docker/Dockerfile.backend
          push: false
          tags: shopflow-backend:latest

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: application/frontend
          file: docker/Dockerfile.frontend
          push: false
          tags: shopflow-frontend:latest

  helm-lint:
    name: Lint Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.13.0'

      - name: Run Helm Lint
        run: |
          helm lint helm/shopflow
