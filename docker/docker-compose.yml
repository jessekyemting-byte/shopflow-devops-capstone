services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: shopflow
      POSTGRES_USER: shopuser
      POSTGRES_PASSWORD: shoppassword
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopuser -d shopflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../application/backend
      dockerfile: ../../docker/Dockerfile.backend
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=postgres
      - DB_USER=shopuser
      - DB_PASSWORD=shoppassword
      - DB_NAME=shopflow
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../application/frontend
      dockerfile: ../../docker/Dockerfile.frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
